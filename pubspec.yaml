name: utify
description: "Utify music streaming app."
publish_to: 'none'

version: 1.5.0+11

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # YouTube data extraction (no API key needed)
  youtube_explode_dart: ^3.1.0

  # Audio playback
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.12
  audio_service: ^0.18.15

  # Windows/Linux audio backend for just_audio (Android uses just_audio natively)
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: any

  # MP3 conversion on Android (not used on Windows — see lib/platform/ffmpeg_converter.dart)
  ffmpeg_kit_flutter_new_audio: ^2.5.2

  # Local storage with Hive
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Network connectivity (Wi-Fi only gating for audio prefetch)
  connectivity_plus: ^7.0.0

  # UI utilities
  cached_network_image: ^3.4.1
  # Direct dep: used to configure the custom artwork CacheManager
  # (already resolved transitively via cached_network_image).
  flutter_cache_manager: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  palette_generator: ^0.3.3+3
  equatable: ^2.0.5

  # Icons
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.6
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5
  webview_flutter_windows: ^1.2.0

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  google_sign_in: ^6.2.2

  # In-app updates (desktop only)
  http: ^1.2.2
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.1

  # Windows taskbar thumbnail toolbar (Prev/Play-Pause/Next buttons)
  windows_taskbar: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
