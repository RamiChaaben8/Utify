  #         cache: true
  #     - run: flutter pub get
  #     - run: flutter build macos --release
  #     - name: Zip macOS build
  #       run: |
  #         cd build/macos/Build/Products/Release
  #         zip -r ../../../../../utify-macos.zip Utify.app
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         name: utify-macos
  #         path: utify-macos.zip
  #         retention-days: 1

  # ── Linux build (disabled — uncomment when ready) ──────────────────────────
  # build-linux:
  #   name: Build Linux
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Install build deps
  #       run: |
  #         sudo apt-get update -y
  #         sudo apt-get install -y clang cmake ninja-build pkg-config \
  #           libgtk-3-dev liblzma-dev libstdc++-12-dev
  #     - uses: subosito/flutter-action@v2
  #       with:
  #         channel: 'stable'
  #         cache: true
  #     - run: flutter pub get
  #     - run: flutter build linux --release
  #     - name: Package Linux build
  #       run: tar -czf utify-linux.tar.gz -C build/linux/x64/release/bundle .
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         name: utify-linux
  #         path: utify-linux.tar.gz
  #         retention-days: 1

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/utify-release.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=utify-release.jks
          EOF
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release APKs
        env:
          RELEASE_TAG: ${{ env.UTIFY_RELEASE_TAG }}
        run: |
          VERSION="$(echo "$RELEASE_TAG" | sed -E 's/^[vV]//')"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then VERSION="$VERSION.0"; fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          BUILD_NUMBER=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          flutter build apk --release --split-per-abi \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER"
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: utify-android-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 1

  # ── Publish GitHub Release ─────────────────────────────────────────────────
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    # Add build-macos and build-linux to the needs list when those jobs are enabled.

    steps:
      - name: Checkout (for commit history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: utify-windows
          path: artifacts/

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: utify-android-apks
          path: artifacts/

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then
            NOTES=$(git log --pretty=format:"- %s%n%b" | head -30)
          else
            NOTES=$(git log "${PREV}..HEAD" --pretty=format:"- %s%n%b")
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.UTIFY_RELEASE_TAG }}
          name: "Utify ${{ env.UTIFY_RELEASE_TAG }}"
          body: |
            ## What's new in ${{ env.UTIFY_RELEASE_TAG }}

            ${{ steps.changelog.outputs.notes }}

            ---
            **Platform support:** Windows ✅ &nbsp;|&nbsp; Android ✅ (release-signed) &nbsp;|&nbsp; macOS 🔜 &nbsp;|&nbsp; Linux 🔜

            For most Android phones, download the `app-arm64-v8a-release.apk` asset.
          draft: false
          prerelease: false
          overwrite_files: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
