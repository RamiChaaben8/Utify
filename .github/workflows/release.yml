name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'V*.*.*'
      - 'v*.*'
      - 'V*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and attach assets to
        required: true
        default: V1.3
        type: string

permissions:
  contents: write

env:
  UTIFY_RELEASE_TAG: ${{ github.ref_name == 'V1.2-android' && 'V1.2' || inputs.release_tag || github.ref_name }}

jobs:

  # ── Windows build ───────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Install NuGet
        uses: nuget/setup-nuget@v2

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        run: flutter build windows --release

      - name: Build installer (.exe)
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.UTIFY_RELEASE_TAG }}
        run: |
          # Extract version from tag (strip leading V or v)
          $version = "$env:RELEASE_TAG" -replace '^[Vv]', ''
          if ($version.Split('.').Length -eq 2) { $version = "$version.0" }
          Write-Host "Building installer for version $version"

          # Inno Setup is pre-installed on GitHub Actions windows-latest runners
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            # Fallback path for newer runner images
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup not found — installing via Chocolatey"
            choco install innosetup --no-progress -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }

          # Create output directory
          New-Item -ItemType Directory -Force -Path "installer\Output" | Out-Null

          # Compile the installer, injecting the version number
          & $iscc "installer\utify.iss" /DMyAppVersion=$version
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

          # Rename output to predictable name
          Move-Item "installer\Output\utify-setup.exe" "utify-windows-setup.exe" -Force
          Write-Host "Installer size: $((Get-Item utify-windows-setup.exe).Length) bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: utify-windows
          path: utify-windows-setup.exe
          retention-days: 1

  # ── macOS build (disabled — uncomment when ready) ──────────────────────────
  # build-macos:
